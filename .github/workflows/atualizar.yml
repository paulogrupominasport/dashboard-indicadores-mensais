name: Atualizar dados do dashboard

on:
  schedule:
    - cron: '*/2 * * * *'      # a cada 30 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:            # permite rodar manualmente no botão "Run workflow"
  push:
    paths:
      - 'gerar_dados.py'
      - '.github/workflows/atualizar.yml'

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install pandas openpyxl

      - name: Baixar a planilha publicada (.xlsx)
        env:
          # Opcional: defina o secret XLSX_URL no repositório para sobrescrever a URL abaixo.
          XLSX_URL: ${{ secrets.XLSX_URL }}
        run: |
          URL="${XLSX_URL:-https://docs.google.com/spreadsheets/d/e/2PACX-1vRPnmOI8EY_i1VbKwGWTwEHZGR2eU2cgwfFWuoxwPQcrp8VyDcqtwC9kAQdFrHnm5Z8IwEUPxrFB-9b/pub?output=xlsx}"
          echo "Baixando planilha publicada..."
          curl -L --fail --retry 3 --retry-delay 5 -o base.xlsx "$URL"
          ls -la base.xlsx

      - name: Gerar dados.json
        env:
          FONTE_LABEL: 'Planilha online (Google) · atualização automática'
        run: python gerar_dados.py base.xlsx

      - name: Commit do dados.json (se houver mudança)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain dados.json | grep -q .; then
            git add dados.json
            git commit -m "Atualiza dados.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "dados.json atualizado e enviado."
          else
            echo "Sem mudancas em dados.json."
          fi
